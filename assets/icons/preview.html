<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Active Time – icon candidates</title>
<style>
  body { font: 13px "Segoe UI", sans-serif; margin: 24px; background: #f5f5f5; color: #1e1e2e; }
  h1 { font-size: 18px; }
  .icon { display: grid; grid-template-columns: 140px auto auto; gap: 16px; align-items: center; margin-bottom: 12px; justify-content: start; }
  .sizes { display: flex; gap: 12px; align-items: end; padding: 10px; border-radius: 8px; }
  .dark { background: #202020; }
  .light { background: #ffffff; border: 1px solid #ddd; }
  .name { font-weight: 600; }
</style>
</head>
<body>
<h1>Active Time – icon candidates (96 / 48 / 32 / 24 / 16 px)</h1>
<div id="list"></div>
<script>
  const icons = [
    ["icon-ring.svg", "A · 24h ring"],
    ["icon-bars.svg", "B · Timeline bars"],
    ["icon-clock-moon.svg", "C · Clock + moon"],
    ["icon-monitor.svg", "D · Monitor + moon"],
  ];
  const sizes = [96, 48, 32, 24, 16];
  const list = document.getElementById("list");
  for (const [file, name] of icons) {
    const row = document.createElement("div");
    row.className = "icon";
    const images = sizes.map(size => `<img src="${file}" width="${size}" height="${size}" alt="">`).join("");
    row.innerHTML = `<span class="name">${name}</span>
      <div class="sizes dark">${images}</div>
      <div class="sizes light">${images}</div>`;
    list.appendChild(row);
  }
</script>
</body>
</html>
