[package]
name = "TimeRecon"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Drichel"]
license = "MIT"
description = "Reconstruct PC uptime and activity from system event logs."

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_EventLog"] }

[target.'cfg(windows)'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["glow"]

[target.'cfg(target_os = "linux")'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["glow", "wayland", "x11", "default_fonts"]

[target.'cfg(target_os = "macos")'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["glow", "default_fonts"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
