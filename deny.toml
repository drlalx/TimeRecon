# cargo-deny configuration for TimeRecon (time-recon)
# Ensures all dependencies are licensed and compatible with the MIT license.
# Reference: https://embarkstudios.github.io/cargo-deny/

[licenses]
# Fail if any crate has no license specified
unlicensed = "deny"

# Fail if any crate uses strong copyleft (e.g. GPL / AGPL)
copyleft = "deny"

# Confidence threshold for detecting license files
confidence-threshold = 0.8

# List of allowed licenses compatible with MIT
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Local workspace packages are ignored
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
